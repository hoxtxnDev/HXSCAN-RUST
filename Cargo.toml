[package]
name = "tcpscan"
version = "2.1.0"
edition = "2021"
authors = ["hoxtxnDev"]
description = "Staged Mediator TCP port scanner with stealth/mutable traffic blending, anti-AI legitimacy envelope and behavioral honeypot classification (HXSCAN Rust Edition)"
license = "MIT"
repository = "https://github.com/hoxtxnDev/HXSCAN-RUST"
readme = "README.md"
default-run = "tcpscan"
keywords = ["cybersecurity", "port-scanner", "tcp", "pentesting", "soc"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "tcpscan"
path = "src/lib.rs"

[[bin]]
name = "tcpscan"
path = "src/main.rs"

[[bin]]
name = "hxscan"
path = "src/bin/hxscan.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
