[package]
name = "tcpscan"
version = "3.0.0"
edition = "2021"
authors = ["hoxtxnDev"]
description = "Ultimate Recon & Staged Mediator TCP scanner: Nmap/Naabu/RustScan ergonomics, TLS/X.509, CPE/CVE correlation, CIDR multi-target, stealth/mutable & honeypot filtering (HXSCAN Rust Edition)"
license = "MIT"
repository = "https://github.com/hoxtxnDev/HXSCAN-RUST"
readme = "README.md"
default-run = "tcpscan"
keywords = ["cybersecurity", "port-scanner", "tcp", "pentesting", "soc"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "tcpscan"
path = "src/lib.rs"

[[bin]]
name = "tcpscan"
path = "src/main.rs"

[[bin]]
name = "hxscan"
path = "src/bin/hxscan.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
